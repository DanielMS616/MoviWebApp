{% extends "base.html" %}

{% block content %}
    <h1>Favorite Movies</h1>

    <form
        action="{{ url_for('add_movie', user_id=user_id) }}"
        method="post"
    >
        <label for="title">Movie title</label>

        <input
            type="text"
            id="title"
            name="title"
            required
        >

        <button type="submit">Add Movie</button>
    </form>

    <ul class="movie-list">
        {% for movie in movies %}
            <li class="movie-entry">
                <h2>{{ movie.name }}</h2>

                <p>Director: {{ movie.director }}</p>
                <p>Year: {{ movie.year }}</p>

                <img
                    src="{{ movie.poster_url }}"
                    alt="Poster for {{ movie.name }}"
                >

                <form
                    action="{{ url_for(
                        'update_movie',
                        user_id=user_id,
                        movie_id=movie.id
                    ) }}"
                    method="post"
                >
                    <label for="title-{{ movie.id }}">
                        New title
                    </label>

                    <input
                        type="text"
                        id="title-{{ movie.id }}"
                        name="title"
                        value="{{ movie.name }}"
                        required
                    >

                    <button type="submit">Update Movie</button>
                </form>
            </li>
        {% endfor %}
    </ul>

    <a href="{{ url_for('index') }}">Back to users</a>
{% endblock %}
